[package]
name = "codex-quota-ring"
version = "0.3.1"
description = "Local-only Windows Codex quota rail"
authors = ["Codex Quota Ring contributors"]
edition = "2021"

[lib]
name = "codex_quota_ring_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
sysinfo = "0.37"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }
